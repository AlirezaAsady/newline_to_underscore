<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تبدیل متن</title>
  <link rel="stylesheet" href="css/newline_to_underscore.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="head1">تبدیل متن (هر کاراکتر به کاراکتر دیگر)</h1>
      <p class="lead"> (<code>\n</code>) <code>--></code> "_"</p>
    </header>

    <div class="grid">
        <!-- ورودی -->
        <div>
            <label for="inputText">متن ورودی</label><br>
            <textarea class="lead" id="inputText" placeholder="متن خود را اینجا بچسبانید..."></textarea>
            <div class="btn-row">
              <button id="pasteBtn" class="secondary small">چسباندن</button>
              <button id="clearBtn" class="secondary small">پاک کردن</button>
            </div>
        </div>

        <!-- کنترل‌ها -->
        <div class="controls">
            <!-- انتخاب target و replacement -->
            <div class="lead swap-row">
              <label for="target">جایگزین کن:</label>
              <input id="target" type="text" value="\n" style="flex:1"
                      title="متن یا کاراکتر اصلی (\\n برای اینتر)" />
              <span class="lead muted">→</span>
              <input id="replacement" type="text" value="_" style="flex:1"
                      title="متن یا کاراکتر جایگزین" />
            </div>

            <!-- نوار انتخاب رنگ -->
            <div class="color-controls">
              <div class="color-group">
                <div class="color-label">رنگ کاراکتر جایگزین</div>
                <div class="color-bar" id="colorBar">
                  <button class="color-swatch active" data-color="rgb(0, 0, 0)" title="مشکی"></button>
                  <button class="color-swatch" data-color="rgb(239, 68, 68)" title="قرمز"></button>
                  <button class="color-swatch" data-color="rgb(34, 197, 94)" title="سبز"></button>
                  <button class="color-swatch" data-color="rgb(59, 130, 246)" title="آبی"></button>
                </div>
              </div>
              <input id="colorPicker" type="color" value="#000000" aria-label="انتخاب رنگ" />
              <input id="colorInput" type="text" value="rgb(0, 0, 0)" placeholder="مثال: #ff0000 یا rgb(255,0,0)" />
            </div>


            <!-- dropdown گزینه‌ها -->
            <div class="dropdown" id="optionsDropdown">
                <div class="dropdown-btn">انتخاب گزینه‌ها ▾</div>
                <div class="dropdown-list">
                <label class="dropdown-item selected">
                    <input type="checkbox" value="trim" checked>
                    حذف فضاهای اضافی ابتدای/پایان هر خط
                </label>
                <label class="dropdown-item selected">
                    <input type="checkbox" value="squash" checked>
                    جایگزینی چند اینتر متوالی با یک مقدار
                </label>
                <label class="dropdown-item selected">
                    <input type="checkbox" value="preserve" checked>
                    حفظ اینتر انتهای متن (در صورت وجود)
                </label>
                </div>
            </div>

            <div class="action-row">
                <button id="convertBtn">تبدیل</button>
                <button id="copyBtn" class="secondary">کپی</button>
                <button id="swapBtn" class="secondary">↔ جابجایی</button>
                <button id="downloadBtn" class="secondary">دانلود .txt</button>
                <button id="downloadRtfBtn" class="secondary">دانلود RTF</button>
            </div>

            <div>
                <label for="outputText">نتیجه</label></Br>
                <div class="output-preview is-empty" id="outputText" aria-live="polite" tabindex="0">
                  خروجی بعد از تبدیل نمایش داده می‌شود.
                </div>
            </div>
        </div>
    </div>
  </div>

  <script src="js/newline_to_underscore.js" defer></script>
</body>
</html>
